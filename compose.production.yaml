# Production BentoML serving via Docker Hub + Docker Compose — no Kubernetes.
# deploy.py sets DOCKER_IMAGE (Docker Hub repo) and DOCKER_TAG (always `latest`);
# the image is pulled, never built locally. Bento runs at
# http://127.0.0.1:3000.
services:
  bento:
    image: ${DOCKER_IMAGE}:${DOCKER_TAG}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s