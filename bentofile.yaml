# Template copied and pinned by deploy.py; `latest` model refs are placeholders.
# Image dependencies live in service.py; nn_best is included as an ONNX artifact.
name: stacked_ensemble
service: "src/serving/service.py:TennisPredictor"
include:
  - "src/"
  - "infra/postgres/init.sql"
  - "data/processed/linear_scaler.pkl"
  - "data/processed/bio_embeddings.npz"
  - "data/processed/bio_feature_cols.json"
  - "data/processed/nn_best.onnx"
  - "data/processed/player_similarity.index"
  - "data/processed/player_metadata.json"
  - "data/processed/model_info.json"
models:
  - "linear_best:latest"
  - "gbdt_best:latest"
  - "ensemble_lr_model:latest"
