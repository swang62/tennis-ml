apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefect-worker
  labels:
    app: prefect-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prefect-worker
  template:
    metadata:
      labels:
        app: prefect-worker
    spec:
      containers:
        - name: prefect-worker
          image: prefecthq/prefect:3.7.3-python3.11
          command:
            - /bin/bash
            - -c
            - |
              for i in $(seq 1 30); do
                python3 -c "import urllib.request; urllib.request.urlopen('http://prefect-server:4200/api/ready')" 2>/dev/null && break
                echo "Waiting for prefect-server (attempt $i/30)..."
                sleep 2
              done
              exec prefect worker start --pool tennis-pool
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          envFrom:
            - configMapRef:
                name: tennis-default-config
