services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      bento:
        condition: service_healthy
    ports:
      - "127.0.0.1:8187:80"
    environment:
      DRIFT_API_KEY: "${DRIFT_API_KEY:?DRIFT_API_KEY is required}"
    healthcheck:
      test: wget -nv --spider 127.0.0.1 || exit 1
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:18.4
    restart: unless-stopped
    ports:
      - "127.0.0.1:6543:5432"
    volumes:
      - postgres-data-18:/var/lib/postgresql
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tennis
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d tennis" ]
      interval: 60s
      timeout: 5s
      retries: 6
      start_period: 30s

  bento:
    image: ${DOCKER_REPO}/${IMAGE_NAME}:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Production deployment marker for /model_info; local source-mode
      # serving (scripts/dev.sh) never sets this, so it cannot claim
      # production mode.
      SERVING_MODE: production
      DATABASE_URL: postgresql://postgres:password@postgres:5432/tennis
    healthcheck:
      test: [ "CMD-SHELL", 'python -c "import os,psycopg;c=psycopg.connect(os.environ[''DATABASE_URL'']);assert c.execute(''SELECT 1'').fetchone()==(1,)"' ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    pull_policy: always

volumes:
  postgres-data-18:
