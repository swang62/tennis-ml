# Required env vars:
#   POSTGRES_PASSWORD  (also used by bento's DATABASE_URL)
#   BENTO_API_KEY      (authenticates the /api/model_info and /api/predict_from_ids_bulk nginx routes)

services:
  web:
    image: swang62/tennis-web:latest
    # build:
    #   context: ./web
    #   dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      bento:
        condition: service_healthy
    ports:
      - "8187:80"
    environment:
      BENTO_API_URL: ${BENTO_API_URL:-http://bento:3000}
      BENTO_API_KEY: ${BENTO_API_KEY:?BENTO_API_KEY is required}
    healthcheck:
      test: wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    pull_policy: always

  postgres:
    image: postgres:18.4
    restart: unless-stopped
    ports:
      - "6543:5432"
    volumes:
      - tennis-ml-postgres:/var/lib/postgresql
      - ./infra/postgres/tls:/mnt/tls:ro
    entrypoint: ["/mnt/tls/entrypoint.sh"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: tennis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tennis"]
      interval: 60s
      timeout: 5s
      retries: 6
      start_period: 30s

  bento:
    image: swang62/tennis-bento:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVING_MODE: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/tennis
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request;urllib.request.urlopen("http://localhost:3000/readyz")''',
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    pull_policy: always

volumes:
  tennis-ml-postgres:
