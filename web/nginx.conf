# nginx config for the production dashboard container. Serves the static SPA
# and proxies /api/* to the Bento service, stripping the /api prefix (Bento
# mounts routes at the root, not under /api): /api/healthz -> /healthz,
# /api/predict -> /predict. No websocket proxying needed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://bento:3000/;
        proxy_http_version 1.1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
