[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[project]
name = "tennis-ml"
version = "0.1.0"
description = "Tennis match prediction pipeline using Prefect, MLflow, and BentoML"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
  "prefect>=3.7",
  "mlflow>=3.13",
  "bentoml>=1.4",
  "torch>=2.12",
  "onnxscript>=0.1.0",
  "lightning>=2.6",
  "scikit-learn>=1.8",
  "xgboost>=3.2",
  "lightgbm>=4.6",
  "catboost>=1.2",
  # Stealth-Chromium Playwright wrapper used by the rankings catch-up flow
  # (src/flows/rankings.py); the binary downloads on first launch.
  "cloakbrowser>=0.5.6",
  "optuna>=4.9",
  "papermill>=2.7",
  "pandas>=2.3",
  "numpy>=2.4",
  # Operational database access; DuckDB stays installed for training snapshots.
  "psycopg[binary]>=3.2",
  "duckdb>=1.5",
  # dbt ETL runs against PostgreSQL (dbt-postgres); DuckDB is not a dbt target.
  "dbt-postgres>=1.10",
  "scipy>=1.17",
  "matplotlib>=3.10",
  "seaborn>=0.13",
  "shap>=0.52",
  "numba>=0.65",
  "llvmlite>=0.47",
  "ipykernel>=7.2",
  "rich>=15.0",
  "requests>=2.34",
  "faiss-cpu>=1.14.3",
  "fastembed>=0.8",
  "ipywidgets>=8.1.8",
  "jupyter>=1.1.1",
  "optuna-integration[pytorch-lightning]>=4.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF", "SIM", "TRY", "ARG"]
ignore = ["F401", "TRY003", "E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**/*" = ["I001", "E702", "E402", "E501"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "notebooks"]
exclude = [
    ".venv",
    "**/__pycache__",
    "artifacts",
    "data",
    "dbt",
    "infra",
    "mlruns",
    ".git",
    "**/.ipynb_checkpoints/**",
]
# Untyped notebook MLflow/Lightning APIs need narrow pyright exceptions.
executionEnvironments = [
    # Repo-root extra path lets notebooks import src.*.
    { root = "notebooks", extraPaths = ["."], reportPrivateImportUsage = "none", reportAttributeAccessIssue = "none" },
]
# Data-science dependencies lack stubs; preserve inference boundary guards.
reportAny = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingParameterType = "none"
reportUnusedCallResult = "none"
reportImplicitStringConcatenation = "none"
reportUnnecessaryCast = "none"
reportUnannotatedClassAttribute = "none"
reportUnnecessaryIsInstance = "none"
reportUnreachable = "none"
reportPrivateUsage = "none"
reportMissingTypeStubs = "none"
reportUntypedFunctionDecorator = "none"

[tool.uv.workspace]
members = ["."]

[tool.uv.sources]
tennis-ml = { workspace = true, editable = true }

# arm64-only resolution avoids the shap/llvmlite x86_64 conflict.
[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = [
  "python-dotenv>=1.2.2",
  "ruff>=0.15",
  "pre-commit>=4.6",
  "pytest>=9.1",
  "pytest-env>=1.7",
  "pytest-testmon>=2.2",
  "tennis-ml",
  "basedpyright>=1.39",
  "pandas-stubs>=3.0",
  "pytest-env>=1.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pytest_env]
KMP_DUPLICATE_LIB_OK = "TRUE"
