[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[project]
name = "tennis-ml"
version = "0.1.0"
description = "Tennis match prediction pipeline using Prefect, MLflow, and BentoML"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
  "prefect>=3.7",
  "mlflow>=3.13",
  "bentoml>=1.4",
  "torch>=2.12",
  "lightning>=2.6",
  "scikit-learn>=1.8",
  "xgboost>=3.2",
  "lightgbm>=4.6",
  "catboost>=1.2",
  "optuna>=4.9",
  "papermill>=2.7",
  "pandas>=2.3",
  "numpy>=2.4",
  "duckdb>=1.5",
  "scipy>=1.17",
  "matplotlib>=3.10",
  "seaborn>=0.13",
  "shap>=0.52",
  "numba>=0.65",
  "llvmlite>=0.47",
  "ipykernel>=7.2",
  "rich>=15.0",
  "requests>=2.34",
  "panel>=1.9",
  "plotly>=6.8",
  "faiss-cpu>=1.14.3",
  "fastembed>=0.8",
  "ipywidgets>=8.1.8",
  "jupyter>=1.1.1",
  "optuna-integration[pytorch-lightning]>=4.9.0",
  "dbt-duckdb>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF", "SIM", "TRY", "ARG"]
ignore = ["F401", "TRY003", "E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**/*" = ["I001", "E702", "E402", "E501"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "notebooks"]
exclude = [
    ".venv",
    "**/__pycache__",
    "artifacts",
    "data",
    "dbt",
    "infra",
    "mlruns",
    ".git",
    "**/.ipynb_checkpoints/**",
]
# notebooks/: mlflow.sklearn, mlflow.pytorch and lightning.pytorch are real
# public APIs whose packages ship no typing, so they're flagged as private or
# unknown attributes. Everything else in notebooks is type-checked.
executionEnvironments = [
    # extraPaths is relative to this config file (repo root): "." = repo root,
    # so notebooks/ can `import src.*`. Same pattern as ArcReel's pyproject.
    { root = "notebooks", extraPaths = ["."], reportPrivateImportUsage = "none", reportAttributeAccessIssue = "none" },
]
# Data-science type noise: duckdb, faiss, fastembed, plotly, onnxruntime and
# pytorch-lightning ship no stubs, so Any/Unknown propagates from their APIs.
# reportUnnecessaryIsInstance/reportUnreachable also stay off: the isinstance
# guards in build_inference_features are deliberate trust-boundary validation.
reportAny = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingParameterType = "none"
reportUnusedCallResult = "none"
reportImplicitStringConcatenation = "none"
reportUnnecessaryCast = "none"
reportUnannotatedClassAttribute = "none"
reportUnnecessaryIsInstance = "none"
reportUnreachable = "none"
reportPrivateUsage = "none"
reportMissingTypeStubs = "none"
reportUntypedFunctionDecorator = "none"

[tool.uv.workspace]
members = ["."]

[tool.uv.sources]
tennis-ml = { workspace = true, editable = true }

# shap>=0.52 caps llvmlite <0.46 on x86_64-darwin, which conflicts with the
# llvmlite>=0.47 floor (numba 0.65). The project runs only on this arm64 host,
# so lock resolution is limited to that environment.
[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = [
  "python-dotenv>=1.2.2",
  "ruff>=0.15",
  "pre-commit>=4.6",
  "pytest>=9.1",
  "pytest-testmon>=2.2",
  "tennis-ml",
  "basedpyright>=1.39",
  "pandas-stubs>=3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
