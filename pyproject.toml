[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[project]
name = "tennis-ml"
version = "0.1.0"
description = "Tennis match prediction pipeline using Prefect, MLflow, and BentoML"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
  "scikit-learn>=1.8",
  "xgboost>=3.2",
  "lightgbm>=4.6",
  "torch>=2.12",
  "lightning>=2.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "RUF", "SIM", "TRY", "ARG"]
ignore = ["F401", "TRY003", "E501"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**/*" = ["I001", "E702", "E402", "E501"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "notebooks"]
exclude = [
  ".venv",
  "**/__pycache__",
  "artifacts",
  "data",
  "dbt",
  "infra",
  ".git",
  "**/.ipynb_checkpoints/**",
]
# Untyped notebook MLflow/Lightning APIs need narrow pyright exceptions.
executionEnvironments = [
  # Repo-root extra path lets notebooks import src.*.
  { root = "notebooks", extraPaths = [
    ".",
  ], reportPrivateImportUsage = "none", reportArgumentType = "none", reportPossiblyUnboundVariable = 'none' },
]
# Data-science dependencies lack stubs; preserve inference boundary guards.
reportAny = "none"
reportExplicitAny = "none"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingParameterType = "none"
reportUnusedCallResult = "none"
reportImplicitStringConcatenation = "none"
reportUnnecessaryCast = "none"
reportUnannotatedClassAttribute = "none"
reportUnnecessaryIsInstance = "none"
reportUnreachable = "none"
reportPrivateUsage = "none"
reportPrivateImportUsage = "none"
reportMissingTypeStubs = "none"
reportUntypedFunctionDecorator = "none"

[tool.uv.workspace]
members = ["."]

[tool.uv.sources]
tennis-ml = { workspace = true, editable = true }

# arm64-only resolution avoids the shap/llvmlite x86_64 conflict.
[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
# Runtime serving subset: packages imported by src/serving/ and src/features/
# during prediction only. Strict subset of training — no mlflow/torch/optuna.
inference = [
  "bentoml>=1.4",
  "scikit-learn>=1.8",
  "xgboost>=3.2",
  "lightgbm>=4.6",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pandas>=2.3",
  "numpy>=2.4",
  "onnxruntime>=1.27.0",
  "faiss-cpu>=1.14.3",
  "python-dotenv>=1.2.2",
]

# Model training/tuning: everything notebooks 00-05 and pipeline.py need.
training = [
  { include-group = "inference" },
  "mlflow>=3.13",
  "torch>=2.12",
  "onnxscript>=0.1.0",
  "lightning>=2.6",
  "lightning-sdk>=2026.8.14",
  "optuna>=4.9",
  "optuna-integration[pytorch-lightning]>=4.9.0",
  "papermill>=2.7",
  "scipy>=1.17",
  "matplotlib>=3.10",
  "seaborn>=0.13",
  "shap>=0.52",
  "numba>=0.65",
  "llvmlite>=0.47",
  "fastembed>=0.8",
  "umap-learn>=0.5",
  "kneed>=0.8",
  "ipykernel>=7.2",
  "rich>=15.0",
  "requests>=2.34",
  "ipywidgets>=8.1.8",
  "jupyter>=1.1.1",
  "evidently>=0.7.21",
]

# Local ETL/ops: Prefect orchestration, dbt, DuckDB snapshot, rankings catch-up.
local = [
  { include-group = "training" },
  "prefect>=3.7",
  "duckdb>=1.5",
  "dbt-postgres>=1.10",
  "cloakbrowser[geoip]>=0.5.7",
]

# Full local test/lint/type-check tooling
dev = [
  { include-group = "local" },
  "pytest>=9.1",
  "pytest-env>=1.7.0",
  "pytest-testmon>=2.2",
  "ruff>=0.15",
  "pre-commit>=4.6",
  "python-dotenv>=1.2.2",
  "basedpyright>=1.39",
  "pandas-stubs>=3.0",
  "httpx2>=0.1",
  "tennis-ml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # Upstream deprecations we can't fix: bentoml/prefect/dbt lag pydantic 2.11+
  # (PydanticDeprecatedSince211) and pathspec 1.0 (GitWildMatchPattern rename).
  "ignore:.*GitWildMatchPattern.*:DeprecationWarning",
  "ignore:.*numpy\\.core is deprecated.*:DeprecationWarning",
  "ignore:.*__get_pydantic_core_schema__.*:DeprecationWarning",
  "ignore:.*deprecated function 'Dependency'.*:DeprecationWarning",
  "ignore:.*deprecated class 'DependencyKwarg'.*:DeprecationWarning",
]

[tool.pytest_env]
KMP_DUPLICATE_LIB_OK = "TRUE"
