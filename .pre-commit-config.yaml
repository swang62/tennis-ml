repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, jupyter]
      - id: ruff-format
        types_or: [python, jupyter]

  - repo: local
    hooks:
      - id: kubeconform
        name: kubeconform
        description: Validate Kubernetes YAML manifests
        language: system
        entry: kubeconform -ignore-missing-schemas -summary
        files: ^infra/manifests/.*\.yaml$

      - id: basedpyright
        name: basedpyright
        description: Static type checking of staged files (errors only; config in pyproject.toml)
        language: system
        entry: uv run basedpyright
        types: [python]

      - id: testmon
        name: tests (testmon)
        description: Run only pytest tests affected by the changed files (coverage-based)
        language: system
        entry: uv run pytest --testmon
        pass_filenames: false
        files: ^(src|tests|infra/duckdb)/

      - id: dbt-tests
        name: tests (dbt models)
        description: Run the gold-build e2e test when dbt models or DuckDB init SQL change
        language: system
        entry: uv run pytest tests/test_e2e_ingest_to_inference.py -q
        pass_filenames: false
        files: ^(dbt|infra/duckdb)/
