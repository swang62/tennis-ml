repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, jupyter]
      - id: ruff-format
        types_or: [python, jupyter]

  - repo: local
    hooks:
      - id: kubeconform
        name: kubeconform
        description: Validate Kubernetes YAML manifests
        language: system
        entry: kubeconform -ignore-missing-schemas -summary
        files: ^infra/manifests/.*\.yaml$

      - id: basedpyright
        name: basedpyright
        description: Static type checking (errors only; config in pyproject.toml)
        language: system
        entry: uv run basedpyright
        types: [python]
        pass_filenames: false
