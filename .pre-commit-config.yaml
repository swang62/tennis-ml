repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-format
        types_or: [python, jupyter]

  - repo: local
    hooks:
      - id: kubeconform
        name: kubeconform
        description: Validate Kubernetes YAML manifests
        language: system
        entry: kubeconform -ignore-missing-schemas -summary
        files: ^infra/manifests/.*\.yaml$

      - id: basedpyright
        name: basedpyright
        description: Static type checking of staged files (errors only; config in pyproject.toml)
        language: system
        entry: uv run basedpyright
        types_or: [python, jupyter]

      - id: pytest
        name: pytest
        description: Run the Python test suite with uv
        language: system
        entry: uv run pytest --testmon
        pass_filenames: false
        files: ^(src|tests|infra/duckdb|dbt)/

      - id: biome
        name: biome
        description: Format and lint staged web files with Biome
        language: system
        entry: 'sh -c ''cd web && for f do if ! output=$(pnpm exec biome check --write "${f#web/}" 2>&1); then printf "%s\n" "$output"; exit 1; fi; done'' --'
        files: ^web/.+\.(js|jsx|ts|tsx|mjs|cjs|json|jsonc|css|html)$
        exclude: ^web/(public|dist|node_modules)/

      - id: vitest
        name: vitest
        description: Build the web dashboard and run its Vitest unit tests
        language: system
        entry: sh -c 'cd web && pnpm test'
        pass_filenames: false
        files: ^web/
