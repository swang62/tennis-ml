repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        types_or: [python, jupyter]

      - id: ruff-format
        types_or: [python, jupyter]

  - repo: local
    hooks:
      - id: kubeconform
        name: kubeconform
        description: Validate Kubernetes YAML manifests
        language: system
        entry: kubeconform -ignore-missing-schemas -summary
        files: ^infra/manifests/.*\.yaml$

      - id: basedpyright
        name: basedpyright
        description: Static type checking of staged files (errors only; config in pyproject.toml)
        language: system
        entry: uv run basedpyright
        types_or: [python, jupyter]

      - id: tests
        name: pytest
        description: Run only pytest tests affected by the changed files (coverage-based)
        language: system
        entry: scripts/run_tests.sh
        pass_filenames: false
        files: ^(src|tests|infra/duckdb|dbt)/

      - id: web-checks
        name: pnpm test
        description: TypeScript typecheck and unit tests for the web dashboard
        language: system
        entry: scripts/web_checks.sh
        pass_filenames: false
        files: ^web/
