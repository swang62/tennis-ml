version: 2

sources:
  - name: bronze
    description: Raw match data ingested from CSV by the Prefect ingest flow.
    schema: bronze
    tables:
      - name: match_events
        description: >
          One row per match with both players' stats in the row (player1_* /
          player2_* columns) plus winner_id. The gold layer expands each row
          into two player-perspective rows in silver.player_matches, which
          downstream models build rolling features from.
        columns:
          - name: match_id
            description: Unique match identifier.
          - name: match_date
            description: Match date.
          - name: player1_id
            description: First player.
          - name: player2_id
            description: Second player.
          - name: tournament
            description: Tournament name.
          - name: round
            description: Draw round (r128, r64, r32, r16, qf, sf, f).
          - name: surface
            description: Court surface (clay, grass, hard).
          - name: player1_ranking
            description: ATP ranking of player1 at match time.
          - name: player2_ranking
            description: ATP ranking of player2 at match time.
          - name: player1_wins_last_10
            description: Player1 wins in the 10 matches before this one.
          - name: player1_matches_last_10
            description: Player1 matches played in the 10 before this one.
          - name: player1_aces
            description: Player1 aces in this match.
          - name: player1_double_faults
            description: Player1 double faults in this match.
          - name: player1_first_serves_made
            description: Player1 first serves made in this match.
          - name: player1_total_serve_points
            description: Player1 total serve points in this match.
          - name: player1_first_serve_points_won
            description: Player1 first-serve points won in this match.
          - name: player1_second_serve_points_won
            description: Player1 second-serve points won in this match.
          - name: player1_service_games
            description: Player1 service games played in this match.
          - name: player1_break_points_saved
            description: Player1 break points saved in this match (raw w_bpSaved).
          - name: player1_break_points_faced
            description: Player1 break points faced in this match (raw w_bpFaced).
          - name: player1_rank_points
            description: Player1 ATP ranking points at match time (raw winner_rank_points).
          - name: player1_age
            description: Player1 age in fractional years at match time (raw winner_age).
          - name: player2_wins_last_10
            description: Player2 wins in the 10 matches before this one.
          - name: player2_matches_last_10
            description: Player2 matches played in the 10 before this one.
          - name: player2_aces
            description: Player2 aces in this match.
          - name: player2_double_faults
            description: Player2 double faults in this match.
          - name: player2_first_serves_made
            description: Player2 first serves made in this match.
          - name: player2_total_serve_points
            description: Player2 total serve points in this match.
          - name: player2_first_serve_points_won
            description: Player2 first-serve points won in this match.
          - name: player2_second_serve_points_won
            description: Player2 second-serve points won in this match.
          - name: player2_service_games
            description: Player2 service games played in this match.
          - name: player2_break_points_saved
            description: Player2 break points saved in this match (raw l_bpSaved).
          - name: player2_break_points_faced
            description: Player2 break points faced in this match (raw l_bpFaced).
          - name: player2_rank_points
            description: Player2 ATP ranking points at match time (raw loser_rank_points).
          - name: player2_age
            description: Player2 age in fractional years at match time (raw loser_age).
          - name: winner_id
            description: Player who won the match (player1_id or player2_id).
