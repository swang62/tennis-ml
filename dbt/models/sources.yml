version: 2

sources:
  - name: bronze
    description: Raw match data ingested from the raw ATP CSVs under data/raw by seed.py (host-local, validated, idempotent by match_id).
    schema: bronze
    tables:
      - name: match_events
        description: >
          One row per match with both players' stats in the row (player1_* /
          player2_* columns) plus winner_id. The gold layer expands each row
          into two player-perspective rows in silver.player_matches, which
          downstream models build rolling features from.
        columns:
          - name: match_id
            description: Unique match identifier.
          - name: match_date
            description: Match date.
          - name: match_num
            description: Per-tournament match sequence from the raw ATP CSV (match_num); required, never NULL.
          - name: player1_id
            description: First player.
          - name: player2_id
            description: Second player.
          - name: tournament
            description: Tournament name.
          - name: round
            description: Draw round (r128, r64, r32, r16, qf, sf, f).
          - name: surface
            description: Court surface (clay, grass, hard, carpet); blank or unknown source values are normalized to hard at ingest.
          - name: is_indoor
            description: 1 if indoor, 0 if outdoor, NULL when unknown.
          - name: player1_ranking
            description: ATP ranking of player1 at match time.
          - name: player2_ranking
            description: ATP ranking of player2 at match time.
          - name: player1_wins_last_10
            description: Player1 wins in the 10 matches before this one.
          - name: player1_matches_last_10
            description: Player1 matches played in the 10 before this one.
          - name: player1_aces
            description: Player1 aces in this match.
          - name: player1_double_faults
            description: Player1 double faults in this match.
          - name: player1_first_serves_made
            description: Player1 first serves made in this match.
          - name: player1_total_serve_points
            description: Player1 total serve points in this match.
          - name: player1_first_serve_points_won
            description: Player1 first-serve points won in this match.
          - name: player1_second_serve_points_won
            description: Player1 second-serve points won in this match.
          - name: player1_service_games
            description: Player1 service games played in this match.
          - name: player1_break_points_saved
            description: Player1 break points saved in this match (raw w_bpSaved).
          - name: player1_break_points_faced
            description: Player1 break points faced in this match (raw w_bpFaced).
          - name: player1_rank_points
            description: Player1 ATP ranking points at match time (raw winner_rank_points).
          - name: player1_age
            description: Player1 age in fractional years at match time (raw winner_age).
          - name: player2_wins_last_10
            description: Player2 wins in the 10 matches before this one.
          - name: player2_matches_last_10
            description: Player2 matches played in the 10 before this one.
          - name: player2_aces
            description: Player2 aces in this match.
          - name: player2_double_faults
            description: Player2 double faults in this match.
          - name: player2_first_serves_made
            description: Player2 first serves made in this match.
          - name: player2_total_serve_points
            description: Player2 total serve points in this match.
          - name: player2_first_serve_points_won
            description: Player2 first-serve points won in this match.
          - name: player2_second_serve_points_won
            description: Player2 second-serve points won in this match.
          - name: player2_service_games
            description: Player2 service games played in this match.
          - name: player2_break_points_saved
            description: Player2 break points saved in this match (raw l_bpSaved).
          - name: player2_break_points_faced
            description: Player2 break points faced in this match (raw l_bpFaced).
          - name: player2_rank_points
            description: Player2 ATP ranking points at match time (raw loser_rank_points).
          - name: player2_age
            description: Player2 age in fractional years at match time (raw loser_age).
          - name: winner_id
            description: Player who won the match (player1_id or player2_id).
      - name: player_profiles
        description: >
          One row per player: identity and biography metadata, upserted by
          ingest (src/db/ingest.py) from the ATP player database
          (data/ATP_player_database.csv) and, when enabled, the Wikipedia
          enrichment fallback. Metadata/enrichment only — no aggregates live
          here. The write target for profile identity; dbt derives the
          aggregate gold.player_profiles (player_id + derived aggregates)
          from this source.
        columns:
          - name: player_id
            description: Canonical ATP id (ATP_Database.id); the primary key.
          - name: display_name
            description: Canonical ATP name (ATP_Database.player).
          - name: atp_name
            description: Alternate name variant (ATP_Database.atpname).
          - name: birthdate
            description: Birth date (ATP_Database.birthdate, YYYYMMDD); NULL when unknown.
          - name: weight
            description: Weight in kg (ATP_Database.weight); NULL when unknown.
          - name: height
            description: Height in cm (ATP_Database.height); NULL when unknown.
          - name: turned_pro
            description: Year turned professional (ATP_Database.turnedpro); NULL when unknown.
          - name: birthplace
            description: Birthplace (ATP_Database.birthplace).
          - name: coaches
            description: Coach names (ATP_Database.coaches).
          - name: handedness
            description: Playing hand (R/L; ATP_Database.hand).
          - name: backhand
            description: Backhand style (1H/2H; ATP_Database.backhand).
          - name: ioc
            description: IOC country code (ATP_Database.ioc).
          - name: summary
            description: Wikipedia bio summary written by the enrichment fallback.
          - name: enriched_at
            description: Timestamp of the last Wikipedia enrichment write.
      - name: rankings
        description: >
          Official weekly ATP rankings (rank 1-200) sourced from
          data/raw/rankings/atp_rankings_*.csv, with player IDs resolved
          through data/ranking_player_map.csv to canonical ATP ids. One row
          per (ranking_date, player_id): that composite identity is the
          upsert target of both ingestion paths (seed/ingest and the weekly
          scrape catch-up) and is enforced by the bronze.rankings DB primary
          key in infra/postgres/schema.sql; rank is NOT NULL with a 1-200
          CHECK there.
        columns:
          - name: player_id
            description: Canonical ATP player id (mapped via ranking_player_map.csv).
          - name: ranking_date
            description: Monday of the rankings week.
          - name: rank
            description: Official ATP singles rank (1-200).
          - name: points
            description: ATP ranking points; NULL in early eras.
