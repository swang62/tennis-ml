version: 2

models:
  - name: player_matches
    description: >
      Normalized player-perspective match rows: each bronze.match_events row
      expands into exactly two rows, one per player. Each row carries that
      player's current match context (tournament, round, surface), ranking,
      rank points, age, opponent ranking, raw serve/break stats, outcome, and
      event-relative activity fields (player_match_number, previous_match_date,
      matches_30d_before). No canonical player/opponent orientation and no
      rolling or differential features — downstream models build those from
      this expansion. Composite grain (match_id, player_id) is unique; the
      composite uniqueness test below mirrors the (player_id, match_id) PK
      enforced by the model's post-hook.
    tests:
      - unique:
          arguments:
            column_name: "player_id || '_' || match_id"
    columns:
      - name: match_id
        description: Match identifier. Each match appears exactly twice, once per player.
        tests:
          - not_null
      - name: match_date
        description: Match date.
        tests:
          - not_null
      - name: tournament
        description: Tournament name.
      - name: round
        description: Draw round (r128, r64, r32, r16, qf, sf, f; non-draw stages like "rr" pass through).
      - name: surface
        description: Court surface (clay, grass, hard).
      - name: player_id
        description: The player this row represents (raw player1_id or player2_id from bronze).
        tests:
          - not_null
      - name: opponent_id
        description: The opposing player (the other bronze side).
        tests:
          - not_null
      - name: player_ranking
        description: This player's ATP ranking at match time.
      - name: opponent_ranking
        description: Opponent's ATP ranking at match time.
      - name: player_rank_points
        description: This player's ATP rank points at match time; NULL when missing (0 maps to NULL, the same 0 -> NULL convention as player_ranking).
      - name: opponent_rank_points
        description: Opponent's ATP rank points at match time; NULL when missing.
      - name: player_age
        description: This player's age in fractional years at match time; NULL when missing (0 maps to NULL).
      - name: opponent_age
        description: Opponent's age in fractional years at match time; NULL when missing.
      - name: winner_id
        description: Player who won the match (player_id or opponent_id).
      - name: match_won
        description: 1 if this player won the match, else 0.
      - name: aces
        description: This player's aces in this match.
      - name: double_faults
        description: This player's double faults in this match.
      - name: first_serves_made
        description: This player's first serves made in this match.
      - name: total_serve_points
        description: This player's total serve points in this match.
      - name: first_serve_points_won
        description: This player's first-serve points won in this match.
      - name: second_serve_points_won
        description: This player's second-serve points won in this match.
      - name: service_games
        description: This player's service games played in this match.
      - name: break_points_saved
        description: This player's break points saved in this match (raw w/l_bpSaved).
      - name: break_points_faced
        description: This player's break points faced in this match (raw w/l_bpFaced).
      - name: wins_last_10
        description: This player's wins in the 10 matches before this one.
      - name: matches_last_10
        description: This player's matches played in the 10 before this one.
      - name: player_match_number
        description: >
          1-based ordinal of this player's matches ordered by match_date,
          match_id. 1 for the player's first match.
      - name: previous_match_date
        description: >
          Date of this player's immediately preceding match; NULL for the
          player's first match.
      - name: matches_30d_before
        description: >
          Count of this player's prior matches with match_date in
          [match_date - 30 days, match_date). Excludes the current match and
          same-date matches; 0 for the player's first match.
