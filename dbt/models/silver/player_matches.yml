version: 2

models:
  - name: player_matches
    description: >
      Normalized player-perspective match rows: each bronze.match_events row
      expands into exactly two rows, one per player. Each row carries that
      player's current match context (surface), ranking, rank points, age,
      opponent ranking, raw serve/break stats, outcome, and event-relative
      activity fields (player_match_number, matches_30d_before). No canonical
      player/opponent orientation and no rolling or differential features —
      downstream models build those from this expansion. Composite grain
      (player_id, match_id) is unique, enforced by the DB primary key
      pk_player_matches that the model's post-hook creates (dbt's incremental
      unique_key alone is not a constraint). match_id, match_date, player_id,
      and opponent_id are non-null by construction (they pass through bronze
      NOT NULL columns unchanged) and are DB-enforced via the model's
      ensure_not_null_sql post-hook.

      Task 6 reductions: tournament and round are removed (joined from bronze
      by match_id where needed); is_indoor is removed (joined from bronze);
      winner_id, opponent_rank_points, opponent_age, the ATP-provided
      wins_last_10/matches_last_10, and previous_match_date are removed.
      Surface stays because rolling surface form needs it.
    columns:
      - name: match_id
        description: Match identifier. Each match appears exactly twice, once per player.
      - name: match_date
        description: Match date.
      - name: surface
        description: Court surface (clay, grass, hard, carpet); blank or unknown source values are normalized to hard at ingest.
      - name: player_id
        description: The player this row represents (raw player1_id or player2_id from bronze).
      - name: opponent_id
        description: The opposing player (the other bronze side).
      - name: player_ranking
        description: This player's ATP ranking at match time.
      - name: opponent_ranking
        description: Opponent's ATP ranking at match time.
      - name: player_rank_points
        description: This player's ATP rank points at match time; NULL when missing (0 maps to NULL, the same 0 -> NULL convention as player_ranking).
      - name: player_age
        description: This player's age in fractional years at match time; NULL when missing (0 maps to NULL).
      - name: match_won
        description: 1 if this player won the match (winner_id == this player), else 0.
      - name: aces
        description: This player's aces in this match.
      - name: double_faults
        description: This player's double faults in this match.
      - name: first_serves_made
        description: This player's first serves made in this match.
      - name: total_serve_points
        description: This player's total serve points in this match.
      - name: first_serve_points_won
        description: This player's first-serve points won in this match.
      - name: second_serve_points_won
        description: This player's second-serve points won in this match.
      - name: service_games
        description: This player's service games played in this match.
      - name: break_points_saved
        description: This player's break points saved in this match (raw w/l_bpSaved).
      - name: break_points_faced
        description: This player's break points faced in this match (raw w/l_bpFaced).
      - name: return_points_won
        description: >
          Return points this player won while returning: the OPPONENT's serve
          points not won (opponent total serve points minus the opponent's
          first + second serve points won). Derived from the bronze raw serve
          counts of the opposing side; input to rolling_features'
          return_points_won_pct_10.
      - name: return_points_available
        description: >
          Return points available to this player while returning: the
          OPPONENT's total serve points in this match. Denominator of
          rolling_features' return_points_won_pct_10.
      - name: player_match_number
        description: >
          1-based ordinal of this player's matches ordered by match_date,
          match_id. 1 for the player's first match.
      - name: matches_30d_before
        description: >
          Count of this player's prior matches with match_date in
          [match_date - 30 days, match_date). Excludes the current match and
          same-date matches; 0 for the player's first match.