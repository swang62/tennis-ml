version: 2

models:
  - name: player_rankings
    description: >
      Ranking observations derived only from bronze.match_events. Each raw
      match (one row with both players) is expanded into two ranking rows —
      one per player at that match date. Rankings <= 0 (unranked) are
      excluded. This is the ranking time series; gold.match_features keeps
      ranking only as a per-match feature column.
    tests:
      # One ranking row per player per match. dbt-duckdb's built-in unique test
      # takes a single column_name, so express the composite key as a
      # concatenation; '_' is not a valid character in either id.
      - unique:
          arguments:
            column_name: "match_id || '_' || player_id"
    columns:
      - name: match_id
        tests:
          - not_null
      - name: match_date
        tests:
          - not_null
      - name: player_id
        tests:
          - not_null
      - name: ranking
        tests:
          - not_null
