version: 2

models:
  - name: rolling_features
    description: Post-match player snapshots store rolling form for leakage-free training and inference.
    columns:
      - name: player_id
        description: Player this post-match snapshot describes.
      - name: match_id
        description: Match that produced this snapshot. One snapshot per (player_id, match_id).
      - name: snapshot_date
        description: Date of the completed match this snapshot was taken after.
      - name: player_match_number
        description: 1-based ordinal of the player's matches; this snapshot is the post-match state of the player's Nth match.
      - name: surface
        description: Surface of the snapshot match (clay, grass, hard, carpet); blank or unknown source values are normalized to hard at ingest.
      - name: latest_player_ranking
        description: The player's ATP ranking at the snapshot match, the latest observed ranking in the player's history so far.
      - name: latest_player_rank_points
        description: The player's ATP rank points at the snapshot match (NULL when missing, 0->NULL); backs inference rank_points_diff; not a model feature.
      - name: latest_player_age
        description: The player's age in fractional years at the snapshot match (NULL when missing, 0->NULL).
      - name: win_rate_10
        description: Beta-smoothed win rate over the last 10 completed matches.
      - name: ace_rate_10
        description: (aces + 1) / (first_serves_made + 2) over the last 10 matches including this one; smoothed, never NULL.
      - name: first_serve_pct_10
        description: (first_serves_made + 1) / (total_serve_points + 2) over the last 10 matches including this one; smoothed, never NULL.
      - name: break_points_saved_pct_10
        description: (break_points_saved + 1) / (break_points_faced + 2) over the last 10 matches including this one; smoothed, never NULL.
      - name: first_serve_win_pct_10
        description: (first_serve_points_won + 1) / (first_serves_made + 2) over the last 10 matches including this one; smoothed, never NULL.
      - name: second_serve_win_pct_10
        description: (second_serve_points_won + 1) / (total_serve_points - first_serves_made + 2) over the last 10 matches including this one; smoothed, never NULL.
      - name: serve_win_pct_10
        description: (first_serve_points_won + second_serve_points_won + 1) / (total_serve_points + 2) over the last 10 matches including this one; smoothed, never NULL.
      - name: return_points_won_pct_10
        description: "Beta(1,1)-smoothed return percentage over last 10 matches: (return_points_won+1)/(return_points_available+2); never NULL"
      - name: aces_per_svc_game_10
        description: Aces per service game over the last 10 matches.
      - name: df_rate_10
        description: (double_faults + 1) / (total_serve_points + 2) over the last 10 matches including this one; smoothed, never NULL.
      - name: matches_10
        description: Number of matches backing the last-10 rates.
      - name: avg_player_rank_10
        description: Average of the player's own ranking over the last 10 matches; match_features derives rank_trend_10 from it.
      - name: avg_rank_faced_10
        description: Average opponent_ranking over the last 10 matches (strength of schedule); AVG skips NULL opponent rankings.
      - name: streak
        description: "Single signed current run including this match: positive=consecutive wins, negative=losses; replaces old separate win/loss streak columns."
      - name: clay_win_rate_10
        description: Beta(1,1)-smoothed (wins+1)/(clay matches+2) over last 10 on clay; carried forward on non-clay snapshots; NULL until first clay match.
      - name: grass_win_rate_10
        description: Beta(1,1)-smoothed (wins+1)/(grass matches+2) over last 10 on grass; carried forward on non-grass snapshots; NULL until first grass match.
      - name: hard_win_rate_10
        description: Beta(1,1)-smoothed (wins+1)/(hard matches+2) over last 10 on hard; carried forward on non-hard snapshots; NULL until first hard match.
