version: 2

models:
  - name: match_features
    description: >
      ONE ROW PER MATCH, lower-id player_* side, built by pairing each
      player_match row with that player's immediately preceding post-match
      snapshot (player_match_number - 1) from gold.rolling_features,
      then collapsing the two perspectives into one canonical row. The current
      event supplies match context and current rankings; the prior snapshot
      supplies all rolling history, so no value leaks from the current match
      into the features. `match_won` = 1 iff the canonical player_* side won.
    tests:
      # One row per match (composite key collapsed: each match appears once).
      - unique:
          arguments:
            column_name: "match_id"
    columns:
      - name: match_id
        description: Unique match identifier.
        tests:
          - not_null
      - name: match_date
        description: Match date.
        tests:
          - not_null
      - name: player_id
        description: Canonical player (lower/stable ATP id).
        tests:
          - not_null
      - name: opponent_id
        description: Opponent (higher ATP id).
        tests:
          - not_null
      - name: tournament
        description: Tournament name.
        tests:
          - not_null
      - name: round
        description: Draw round (r128, r64, r32, r16, qf, sf, f); non-draw stages such as "rr" pass through and encode as round_encoded 0.
        tests:
          - not_null
      - name: surface
        description: Court surface (clay, grass, hard).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [clay, grass, hard]
      - name: match_won
        description: 1 if the canonical player_* side won, else 0 (the label).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: player_ranking
        description: >
          Canonical player ranking at match time; NULL when unranked (ATP
          rank 0 maps to NULL in silver.player_matches). Imputed at train time.
      - name: opponent_ranking
        description: >
          Opponent ranking at match time; NULL when unranked (ATP rank 0 maps
          to NULL in silver.player_matches). Imputed at train time.
      - name: player_age
        description: >
          Canonical player age in fractional years at match time; NULL when
          missing (0 maps to NULL in silver.player_matches). Imputed at train
          time.
      - name: opponent_age
        description: >
          Opponent age in fractional years at match time; NULL when missing.
          Imputed at train time.

      # Current-match per-side serve/break stats (enriched columns only — no
      # as-of-date inference source, so never model features; the rolling
      # versions below are the features). All NULLIF-guarded: NULL when the
      # match had a zero denominator.
      - name: player_first_serve_win_pct
        description: Current-match first-serve win pct (first serve points won / first serves made); NULL when no first serves.
      - name: player_second_serve_win_pct
        description: Current-match second-serve win pct (second serve points won / (total serve points - first serves made)); NULL when no second serves.
      - name: player_serve_win_pct
        description: Current-match serve win pct ((first + second serve points won) / total serve points); NULL when no serve points.
      - name: player_aces_per_svc_game
        description: Current-match aces per service game; NULL when no service games.
      - name: player_df_per_svc_game
        description: Current-match double faults per service game; NULL when no service games.
      - name: player_break_points_saved_pct
        description: Current-match break points saved / faced; NULL when no break points faced.
      - name: opponent_first_serve_win_pct
        description: Opponent current-match first-serve win pct; NULL when no first serves.
      - name: opponent_second_serve_win_pct
        description: Opponent current-match second-serve win pct; NULL when no second serves.
      - name: opponent_serve_win_pct
        description: Opponent current-match serve win pct; NULL when no serve points.
      - name: opponent_aces_per_svc_game
        description: Opponent current-match aces per service game; NULL when no service games.
      - name: opponent_df_per_svc_game
        description: Opponent current-match double faults per service game; NULL when no service games.
      - name: opponent_break_points_saved_pct
        description: Opponent current-match break points saved / faced; NULL when no break points faced.

      # Canonical player-side rolling stats (player_ prefix), from the prior
      # snapshot — all refer to completed matches before this one; NULL on the
      # player's first match (cold start, no zero filling).
      - name: player_win_rate_5
        description: Canonical player rolling win rate, last 5 matches before this one.
      - name: player_win_rate_10
        description: Canonical player rolling win rate, last 10 matches before this one.
      - name: player_win_rate_20
        description: Canonical player rolling win rate, last 20 matches before this one.
      - name: player_weighted_form_10
        description: Canonical player exponentially-decayed win form (0.9 decay per match), last 10 matches before this one.
      - name: player_ace_rate_5
        description: Canonical player rolling ace rate, last 5 matches before this one.
      - name: player_ace_rate_10
        description: Canonical player rolling ace rate, last 10 matches before this one.
      - name: player_first_serve_pct_5
        description: Canonical player rolling first serve pct, last 5 matches before this one.
      - name: player_first_serve_pct_10
        description: Canonical player rolling first serve pct, last 10 matches before this one.
      - name: player_break_points_saved_pct_5
        description: Canonical player rolling break-point save rate, last 5 matches before this one.
      - name: player_break_points_saved_pct_10
        description: Canonical player rolling break-point save rate, last 10 matches before this one.
      - name: player_first_serve_win_pct_5
        description: Canonical player rolling first-serve win pct, last 5 matches before this one.
      - name: player_first_serve_win_pct_10
        description: Canonical player rolling first-serve win pct, last 10 matches before this one.
      - name: player_second_serve_win_pct_5
        description: Canonical player rolling second-serve win pct, last 5 matches before this one.
      - name: player_second_serve_win_pct_10
        description: Canonical player rolling second-serve win pct, last 10 matches before this one.
      - name: player_serve_win_pct_5
        description: Canonical player rolling serve win pct, last 5 matches before this one.
      - name: player_serve_win_pct_10
        description: Canonical player rolling serve win pct, last 10 matches before this one.
      - name: player_aces_per_svc_game_5
        description: Canonical player rolling aces per service game, last 5 matches before this one.
      - name: player_aces_per_svc_game_10
        description: Canonical player rolling aces per service game, last 10 matches before this one.
      - name: player_df_rate_5
        description: Canonical player rolling double-fault rate (double faults / total serve points), last 5 matches before this one; NULL when the window has no serve points.
      - name: player_df_rate_10
        description: Canonical player rolling double-fault rate, last 10 matches before this one; NULL when the window has no serve points.
      - name: player_rank_trend_10
        description: Prior rolling avg ranking (10) minus current event ranking.
      - name: player_rank_trend_20
        description: Prior rolling avg ranking (20) minus current event ranking.
      - name: player_avg_rank_faced_5
        description: Canonical player strength of schedule — rolling average opponent rank, last 5 matches before this one; NULL on first match (AVG skips unranked opponents).
      - name: player_avg_rank_faced_10
        description: Canonical player strength of schedule — rolling average opponent rank, last 10 matches before this one; NULL on first match.
      - name: player_win_streak
        description: Canonical player win streak entering this match (NULL on first match).
      - name: player_loss_streak
        description: Canonical player loss streak entering this match (NULL on first match). Never positive at the same time as player_win_streak.
      - name: player_days_since_last_match
        description: Days since canonical player's last match (365 if none).
      - name: player_matches_30d
        description: Canonical player matches in the 30 days before this match (0 if none).
      - name: player_surface_win_rate_10
        description: Canonical player win rate on this surface, last 10 matches (NULL until first match on surface).

      # Profile-derived identity (from gold.player_profiles; NULL when the
      # player has no profile or a cell is missing, same no-zero-filling
      # policy as the rolling cols).
      - name: player_height
        description: Canonical player height in cm at match time.
      - name: player_is_left_handed
        description: 1 if the canonical player is left-handed (handedness = L), 0 if right-handed (R); NULL when handedness is missing.
      - name: player_years_pro
        description: Years the canonical player has been pro as of the match date (match year - turned_pro).

      # Opponent-side rolling stats (opponent_ prefix), same prior-snapshot
      # semantics as the player side.
      - name: opponent_win_rate_5
        description: Opponent rolling win rate, last 5 matches before this one.
      - name: opponent_win_rate_10
        description: Opponent rolling win rate, last 10 matches before this one.
      - name: opponent_win_rate_20
        description: Opponent rolling win rate, last 20 matches before this one.
      - name: opponent_weighted_form_10
        description: Opponent exponentially-decayed win form (0.9 decay per match), last 10 matches before this one.
      - name: opponent_ace_rate_5
        description: Opponent rolling ace rate, last 5 matches before this one.
      - name: opponent_ace_rate_10
        description: Opponent rolling ace rate, last 10 matches before this one.
      - name: opponent_first_serve_pct_5
        description: Opponent rolling first serve pct, last 5 matches before this one.
      - name: opponent_first_serve_pct_10
        description: Opponent rolling first serve pct, last 10 matches before this one.
      - name: opponent_break_points_saved_pct_5
        description: Opponent rolling break-point save rate, last 5 matches before this one.
      - name: opponent_break_points_saved_pct_10
        description: Opponent rolling break-point save rate, last 10 matches before this one.
      - name: opponent_first_serve_win_pct_5
        description: Opponent rolling first-serve win pct, last 5 matches before this one.
      - name: opponent_first_serve_win_pct_10
        description: Opponent rolling first-serve win pct, last 10 matches before this one.
      - name: opponent_second_serve_win_pct_5
        description: Opponent rolling second-serve win pct, last 5 matches before this one.
      - name: opponent_second_serve_win_pct_10
        description: Opponent rolling second-serve win pct, last 10 matches before this one.
      - name: opponent_serve_win_pct_5
        description: Opponent rolling serve win pct, last 5 matches before this one.
      - name: opponent_serve_win_pct_10
        description: Opponent rolling serve win pct, last 10 matches before this one.
      - name: opponent_aces_per_svc_game_5
        description: Opponent rolling aces per service game, last 5 matches before this one.
      - name: opponent_aces_per_svc_game_10
        description: Opponent rolling aces per service game, last 10 matches before this one.
      - name: opponent_df_rate_5
        description: Opponent rolling double-fault rate (double faults / total serve points), last 5 matches before this one; NULL when the window has no serve points.
      - name: opponent_df_rate_10
        description: Opponent rolling double-fault rate, last 10 matches before this one; NULL when the window has no serve points.
      - name: opponent_rank_trend_10
        description: Prior rolling avg ranking (10) minus current event ranking.
      - name: opponent_rank_trend_20
        description: Prior rolling avg ranking (20) minus current event ranking.
      - name: opponent_avg_rank_faced_5
        description: Opponent strength of schedule — rolling average opponent rank, last 5 matches before this one; NULL on first match.
      - name: opponent_avg_rank_faced_10
        description: Opponent strength of schedule — rolling average opponent rank, last 10 matches before this one; NULL on first match.
      - name: opponent_win_streak
        description: Opponent win streak entering this match (NULL on first match).
      - name: opponent_loss_streak
        description: Opponent loss streak entering this match (NULL on first match). Never positive at the same time as opponent_win_streak.
      - name: opponent_days_since_last_match
        description: Days since opponent's last match (365 if none).
      - name: opponent_matches_30d
        description: Opponent matches in the 30 days before this match (0 if none).
      - name: opponent_surface_win_rate_10
        description: Opponent win rate on this surface, last 10 matches (NULL until first match on surface).
      - name: opponent_height
        description: Opponent height in cm at match time.
      - name: opponent_is_left_handed
        description: 1 if the opponent is left-handed (handedness = L), 0 if right-handed (R); NULL when handedness is missing.
      - name: opponent_years_pro
        description: Years the opponent has been pro as of the match date (match year - turned_pro).

      # Head-to-head (pair-level, per side): prior meetings between the
      # canonical pair, strictly before this match's date, deduped to distinct
      # match_ids, most recent 5 only. Zero prior meetings -> counts 0, win
      # rate 0.5 (neutral, locked). Wins sum to matches; rates sum to 1.
      - name: player_h2h_matches
        description: Prior meetings between the canonical player and opponent (most recent 5, strictly before this match); 0 when never met before.
      - name: player_h2h_wins
        description: Canonical player wins in those prior meetings; 0 when never met before.
      - name: player_h2h_win_rate
        description: Canonical player wins / prior meetings; 0.5 (neutral) when never met before.
      - name: opponent_h2h_matches
        description: Prior meetings between the canonical player and opponent — always equals player_h2h_matches.
      - name: opponent_h2h_wins
        description: Opponent wins in those prior meetings; player_h2h_wins + opponent_h2h_wins = player_h2h_matches.
      - name: opponent_h2h_win_rate
        description: Opponent wins / prior meetings (1 - player_h2h_win_rate); 0.5 (neutral) when never met before.

      # Comparison (differential) features: canonical player minus opponent
      - name: rank_diff
        description: player_ranking - opponent_ranking.
      - name: rank_points_diff
        description: player_rank_points - opponent_rank_points.
      - name: age_diff
        description: player_age - opponent_age.
      - name: win_rate_diff
        description: player_win_rate_10 - opponent_win_rate_10.
      - name: ace_rate_diff
        description: player_ace_rate_10 - opponent_ace_rate_10.
      - name: break_points_saved_pct_diff
        description: player_break_points_saved_pct_10 - opponent_break_points_saved_pct_10.
      - name: first_serve_win_pct_diff
        description: player_first_serve_win_pct_10 - opponent_first_serve_win_pct_10.
      - name: second_serve_win_pct_diff
        description: player_second_serve_win_pct_10 - opponent_second_serve_win_pct_10.
      - name: serve_win_pct_diff
        description: player_serve_win_pct_10 - opponent_serve_win_pct_10.
      - name: aces_per_svc_game_diff
        description: player_aces_per_svc_game_10 - opponent_aces_per_svc_game_10.
      - name: win_streak_diff
        description: player_win_streak - opponent_win_streak.
      - name: matches_30d_diff
        description: player_matches_30d - opponent_matches_30d.
      - name: surface_win_rate_diff
        description: player_surface_win_rate_10 - opponent_surface_win_rate_10.
      - name: rank_trend_diff
        description: player_rank_trend_10 - opponent_rank_trend_10.
      - name: avg_rank_faced_diff
        description: player_avg_rank_faced_10 - opponent_avg_rank_faced_10.
      - name: height_diff
        description: player_height - opponent_height.
      - name: handedness_diff
        description: player_is_left_handed - opponent_is_left_handed.
      - name: years_pro_diff
        description: player_years_pro - opponent_years_pro.

      # Context
      - name: is_clay
        description: 1 if surface = clay, else 0.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_grass
        description: 1 if surface = grass, else 0.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_hard
        description: 1 if surface = hard, else 0.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_carpet
        description: 1 if surface = carpet, else 0.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_indoor
        description: 1 if indoor, 0 if outdoor, NULL when unknown.
      - name: tournament_level
        description: Tournament tier ordinal (grand_slam=4, masters=3, atp_500=2, atp_250=1, else 0).
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4]
      - name: round_encoded
        description: Round ordinal (r128=1 ... f=7, else 0).
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6, 7]
