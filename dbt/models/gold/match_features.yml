version: 2

models:
  - name: match_features
    description: Two directional rows per match use prior snapshots, tour averages, and model features.
    columns:
      - name: match_id
        description: Immutable group key for one physical match; exactly two directional rows (one per player) share it.
      - name: match_date
        description: Match date.
      - name: player_id
        description: The player whose perspective this directional row represents; player_* features and match_won belong to this side.
      - name: opponent_id
        description: The opposing player, from the row player's perspective.
      - name: tournament
        description: Tournament name (joined from bronze).
      - name: round
        description: Draw round, including non-draw stages encoded as round_encoded 0.
      - name: surface
        description: Court surface; blank or unknown values become hard during ingestion.
      - name: match_won
        description: Match outcome label; paired directional rows have complementary values.
      - name: rank_diff
        description: Player ranking minus opponent ranking (prior snapshot, imputed).
      - name: rank_points_diff
        description: Player rank points minus opponent rank points (prior snapshot, imputed).
      - name: age_diff
        description: Player age minus opponent age (prior snapshot, imputed).
      - name: win_rate_diff
        description: player_win_rate_10 - opponent_win_rate_10.
      - name: ace_rate_diff
        description: player_ace_rate_10 - opponent_ace_rate_10 (prior snapshot).
      - name: first_serve_pct_diff
        description: player_first_serve_pct_10 - opponent_first_serve_pct_10.
      - name: break_points_saved_pct_diff
        description: player_break_points_saved_pct_10 - opponent_break_points_saved_pct_10.
      - name: first_serve_win_pct_diff
        description: player_first_serve_win_pct_10 - opponent_first_serve_win_pct_10.
      - name: second_serve_win_pct_diff
        description: player_second_serve_win_pct_10 - opponent_second_serve_win_pct_10.
      - name: serve_win_pct_diff
        description: player_serve_win_pct_10 - opponent_serve_win_pct_10.
      - name: return_points_won_pct_diff
        description: player_return_points_won_pct_10 - opponent_return_points_won_pct_10.
      - name: df_rate_diff
        description: player_df_rate_10 - opponent_df_rate_10.
      - name: aces_per_svc_game_diff
        description: player_aces_per_svc_game_10 - opponent_aces_per_svc_game_10.
      - name: rank_trend_diff
        description: player_rank_trend_10 - opponent_rank_trend_10.
      - name: avg_rank_faced_diff
        description: player_avg_rank_faced_10 - opponent_avg_rank_faced_10.
      - name: streak_diff
        description: player_streak - opponent_streak (signed current run).
      - name: surface_form_diff
        description: Difference between prior surface win rates, using 0.5 for unseen carpet form.
      - name: days_since_last_match_diff
        description: Signed prior rest-day log difference (LN(1+player) - LN(1+opponent)), each rest day capped at 90; missing or stale ages fall back to 90 (no tour-average median).
      - name: elo_diff
        description: Player pre-match global Elo minus opponent pre-match global Elo, joined from silver.elo_snapshots on the exact (player_id, match_id) PK; cold-start participants (or missing snapshot) default to 1500. Reversing player perspective negates the value.
      - name: player_weighted_form_10
        description: Player exponentially-decayed win form, last 10 matches before this one.
      - name: opponent_weighted_form_10
        description: Opponent exponentially-decayed win form, last 10 matches before this one.
      - name: player_matches_10
        description: Matches actually observed in the row player's 10-match window backing its 10-match rates (0 for cold start).
      - name: opponent_matches_10
        description: Matches actually observed in the opponent's 10-match window backing its 10-match rates (0 for cold start).
      - name: player_is_left_handed
        description: Row player's left-handed flag, using the pool rate for unknown handedness.
      - name: opponent_is_left_handed
        description: 1 if the opponent is left-handed, 0 if right-handed; pool left-handed rate when missing or non-L/R.
      - name: player_years_pro
        description: Years the row player has been pro as of the match date (match year - turned_pro); pool mean when missing.
      - name: opponent_years_pro
        description: Years the opponent has been pro as of the match date (match year - turned_pro); pool mean when missing.
      - name: h2h_exposure
        description: Count of the five most recent prior meetings, shared by both directional rows.
      - name: h2h_advantage
        description: Smoothed prior head-to-head advantage from the row player's perspective.
      - name: h2h_surface_advantage
        description: Smoothed prior head-to-head advantage on the current surface.
      - name: is_clay
        description: 1 if surface = clay, else 0.
      - name: is_grass
        description: 1 if surface = grass, else 0.
      - name: is_hard
        description: 1 if surface = hard, else 0.
      - name: is_indoor
        description: 1 if indoor, 0 if outdoor, 0 when unknown (joined from bronze).
      - name: best_of
        description: Best-of-N format from bronze, defaulting NULL legacy values to 3.
      - name: tournament_level
        description: Tournament tier ordinal (grand_slam=4, masters=3, atp_500=2, atp_250=1, else 0); the CASE-ELSE derivation guarantees the 0-4 domain.
      - name: round_encoded
        description: Round ordinal (r128=1 ... f=7, else 0); the CASE-ELSE derivation guarantees the 0-7 domain.
      - name: player_first_serve_pct_10
        description: Row player's first-serve percentage, last 10 (similarity-only).
      - name: opponent_first_serve_pct_10
        description: Opponent's first-serve percentage, last 10 (similarity-only).
      - name: player_first_serve_win_pct_10
        description: Row player's first-serve win percentage, last 10 (similarity-only).
      - name: opponent_first_serve_win_pct_10
        description: Opponent's first-serve win percentage, last 10 (similarity-only).
      - name: player_second_serve_win_pct_10
        description: Row player's second-serve win percentage, last 10 (similarity-only).
      - name: opponent_second_serve_win_pct_10
        description: Opponent's second-serve win percentage, last 10 (similarity-only).
      - name: player_serve_win_pct_10
        description: Row player's serve win percentage, last 10 (similarity-only).
      - name: opponent_serve_win_pct_10
        description: Opponent's serve win percentage, last 10 (similarity-only).
      - name: player_return_points_won_pct_10
        description: Row player's return points won percentage, last 10 (similarity-only).
      - name: opponent_return_points_won_pct_10
        description: Opponent's return points won percentage, last 10 (similarity-only).
