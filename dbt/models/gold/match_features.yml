version: 2

models:
  - name: match_features
    description: >
      ONE ROW PER MATCH, lower-id player_* side, built by pairing each
      player_match row with that player's immediately preceding post-match
      snapshot (player_match_number - 1) from silver.rolling_features,
      then collapsing the two perspectives into one canonical row. The current
      event supplies match context and current rankings; the prior snapshot
      supplies all rolling history, so no value leaks from the current match
      into the features. `match_won` = 1 iff the canonical player_* side won.
      Output columns are the 36 FEATURE_COLS preceded by the metadata block
      (match_id, match_date, player_id, opponent_id, tournament, round,
      surface, match_won). Current-match serve/break analysis rates are
      intentionally absent (derived on demand from bronze).
    tests:
      - unique:
          arguments:
            column_name: "match_id"
    columns:
      - name: match_id
        description: Unique match identifier.
        tests:
          - not_null
      - name: match_date
        description: Match date.
        tests:
          - not_null
      - name: player_id
        description: Canonical player (lower/stable ATP id).
        tests:
          - not_null
      - name: opponent_id
        description: Opponent (higher ATP id).
        tests:
          - not_null
      - name: tournament
        description: Tournament name (joined from bronze).
        tests:
          - not_null
      - name: round
        description: Draw round (r128, r64, r32, r16, qf, sf, f); non-draw stages such as "rr" pass through and encode as round_encoded 0.
        tests:
          - not_null
      - name: surface
        description: Court surface (clay, grass, hard, carpet); "0" when the raw CSV left it blank (Davis Cup), which encodes to all-zero surface flags like round_encoded 0.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [clay, grass, hard, carpet, "0"]
      - name: match_won
        description: 1 if the canonical player_* side won, else 0 (the label).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

      # Matchup differences: canonical side minus opponent side.
      - name: rank_diff
        description: player ranking minus opponent ranking (current event).
      - name: rank_points_diff
        description: player rank points minus opponent rank points (current event).
      - name: age_diff
        description: player age minus opponent age (current event).
      - name: win_rate_diff
        description: player_win_rate_10 - opponent_win_rate_10.
      - name: ace_rate_diff
        description: player_ace_rate_10 - opponent_ace_rate_10 (prior snapshot).
      - name: first_serve_pct_diff
        description: player_first_serve_pct_10 - opponent_first_serve_pct_10.
      - name: break_points_saved_pct_diff
        description: player_break_points_saved_pct_10 - opponent_break_points_saved_pct_10.
      - name: first_serve_win_pct_diff
        description: player_first_serve_win_pct_10 - opponent_first_serve_win_pct_10.
      - name: second_serve_win_pct_diff
        description: player_second_serve_win_pct_10 - opponent_second_serve_win_pct_10.
      - name: serve_win_pct_diff
        description: player_serve_win_pct_10 - opponent_serve_win_pct_10.
      - name: df_rate_diff
        description: player_df_rate_10 - opponent_df_rate_10.
      - name: aces_per_svc_game_diff
        description: player_aces_per_svc_game_10 - opponent_aces_per_svc_game_10.
      - name: rank_trend_diff
        description: player_rank_trend_10 - opponent_rank_trend_10.
      - name: avg_rank_faced_diff
        description: player_avg_rank_faced_10 - opponent_avg_rank_faced_10.
      - name: streak_diff
        description: player_streak - opponent_streak (signed current run).

      # Absolute state values where both sides matter.
      - name: player_weighted_form_10
        description: Canonical player exponentially-decayed win form, last 10 matches before this one.
      - name: opponent_weighted_form_10
        description: Opponent exponentially-decayed win form, last 10 matches before this one.
      - name: player_days_since_last_match
        description: Days since canonical player's last match (365 if none).
      - name: opponent_days_since_last_match
        description: Days since opponent's last match (365 if none).
      - name: player_matches_30d
        description: Canonical player matches in the 30 days before this match (0 if none).
      - name: opponent_matches_30d
        description: Opponent matches in the 30 days before this match (0 if none).
      - name: player_surface_win_rate_10
        description: Canonical player win rate on this surface, last 10 matches (NULL until first match on surface).
      - name: opponent_surface_win_rate_10
        description: Opponent win rate on this surface, last 10 matches (NULL until first match on surface).
      - name: player_is_left_handed
        description: 1 if the canonical player is left-handed (handedness = L), 0 if right-handed (R); NULL when handedness is missing.
      - name: opponent_is_left_handed
        description: 1 if the opponent is left-handed, 0 if right-handed; NULL when handedness is missing.
      - name: player_years_pro
        description: Years the canonical player has been pro as of the match date (match year - turned_pro).
      - name: opponent_years_pro
        description: Years the opponent has been pro as of the match date (match year - turned_pro).

      # Canonical-player head-to-head history (0/0 when never met before).
      - name: player_h2h_matches
        description: Prior meetings between the canonical player and opponent (most recent 5, strictly before this match); 0 when never met before.
      - name: player_h2h_wins
        description: Canonical player wins in those prior meetings; 0 when never met before.

      # Numeric match context (one-hot surface for linear and neural models).
      - name: is_clay
        description: 1 if surface = clay, else 0.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_grass
        description: 1 if surface = grass, else 0.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_hard
        description: 1 if surface = hard, else 0.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_carpet
        description: 1 if surface = carpet, else 0.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_indoor
        description: 1 if indoor, 0 if outdoor, NULL when unknown (joined from bronze).
      - name: tournament_level
        description: Tournament tier ordinal (grand_slam=4, masters=3, atp_500=2, atp_250=1, else 0).
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4]
      - name: round_encoded
        description: Round ordinal (r128=1 ... f=7, else 0).
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6, 7]