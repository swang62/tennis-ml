version: 2

models:
  - name: match_features
    description: >
      ONE ROW PER MATCH, lower-id player_* side, built by pairing each
      player_match row with that player's immediately preceding post-match
      snapshot (player_match_number - 1) from gold.player_rolling_features,
      then collapsing the two perspectives into one canonical row. The current
      event supplies match context and current rankings; the prior snapshot
      supplies all rolling history, so no value leaks from the current match
      into the features. `match_won` = 1 iff the canonical player_* side won.
    tests:
      # One row per match (composite key collapsed: each match appears once).
      - unique:
          arguments:
            column_name: "match_id"
    columns:
      - name: match_id
        description: Unique match identifier.
        tests:
          - not_null
      - name: match_date
        description: Match date.
        tests:
          - not_null
      - name: player_id
        description: Canonical player (lower/stable ATP id).
        tests:
          - not_null
      - name: opponent_id
        description: Opponent (higher ATP id).
        tests:
          - not_null
      - name: tournament
        description: Tournament name.
        tests:
          - not_null
      - name: round
        description: Draw round (r128, r64, r32, r16, qf, sf, f).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [r128, r64, r32, r16, qf, sf, f]
      - name: surface
        description: Court surface (clay, grass, hard).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [clay, grass, hard]
      - name: match_won
        description: 1 if the canonical player_* side won, else 0 (the label).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: player_ranking
        description: Canonical player ranking at match time.
        tests:
          - not_null
      - name: opponent_ranking
        description: Opponent ranking at match time.
        tests:
          - not_null

      # Canonical player-side rolling stats (player_ prefix), from the prior
      # snapshot — all refer to completed matches before this one; NULL on the
      # player's first match (cold start, no zero filling).
      - name: player_win_rate_5
        description: Canonical player rolling win rate, last 5 matches before this one.
      - name: player_win_rate_10
        description: Canonical player rolling win rate, last 10 matches before this one.
      - name: player_win_rate_20
        description: Canonical player rolling win rate, last 20 matches before this one.
      - name: player_ace_rate_5
        description: Canonical player rolling ace rate, last 5 matches before this one.
      - name: player_ace_rate_10
        description: Canonical player rolling ace rate, last 10 matches before this one.
      - name: player_first_serve_pct_5
        description: Canonical player rolling first serve pct, last 5 matches before this one.
      - name: player_first_serve_pct_10
        description: Canonical player rolling first serve pct, last 10 matches before this one.
      - name: player_break_pct_5
        description: Canonical player rolling break pct, last 5 matches before this one.
      - name: player_break_pct_10
        description: Canonical player rolling break pct, last 10 matches before this one.
      - name: player_rank_trend_10
        description: Prior rolling avg ranking (10) minus current event ranking.
      - name: player_rank_trend_20
        description: Prior rolling avg ranking (20) minus current event ranking.
      - name: player_win_streak
        description: Canonical player win streak entering this match (NULL on first match).
      - name: player_days_since_last_match
        description: Days since canonical player's last match (365 if none).
      - name: player_matches_30d
        description: Canonical player matches in the 30 days before this match (0 if none).
      - name: player_surface_win_rate_10
        description: Canonical player win rate on this surface, last 10 matches (NULL until first match on surface).

      # Opponent-side rolling stats (opponent_ prefix), same prior-snapshot
      # semantics as the player side.
      - name: opponent_win_rate_5
        description: Opponent rolling win rate, last 5 matches before this one.
      - name: opponent_win_rate_10
        description: Opponent rolling win rate, last 10 matches before this one.
      - name: opponent_win_rate_20
        description: Opponent rolling win rate, last 20 matches before this one.
      - name: opponent_ace_rate_5
        description: Opponent rolling ace rate, last 5 matches before this one.
      - name: opponent_ace_rate_10
        description: Opponent rolling ace rate, last 10 matches before this one.
      - name: opponent_first_serve_pct_5
        description: Opponent rolling first serve pct, last 5 matches before this one.
      - name: opponent_first_serve_pct_10
        description: Opponent rolling first serve pct, last 10 matches before this one.
      - name: opponent_break_pct_5
        description: Opponent rolling break pct, last 5 matches before this one.
      - name: opponent_break_pct_10
        description: Opponent rolling break pct, last 10 matches before this one.
      - name: opponent_rank_trend_10
        description: Prior rolling avg ranking (10) minus current event ranking.
      - name: opponent_rank_trend_20
        description: Prior rolling avg ranking (20) minus current event ranking.
      - name: opponent_win_streak
        description: Opponent win streak entering this match (NULL on first match).
      - name: opponent_days_since_last_match
        description: Days since opponent's last match (365 if none).
      - name: opponent_matches_30d
        description: Opponent matches in the 30 days before this match (0 if none).
      - name: opponent_surface_win_rate_10
        description: Opponent win rate on this surface, last 10 matches (NULL until first match on surface).

      # Comparison (differential) features: canonical player minus opponent
      - name: rank_diff
        description: player_ranking - opponent_ranking.
      - name: win_rate_diff
        description: player_win_rate_10 - opponent_win_rate_10.
      - name: ace_rate_diff
        description: player_ace_rate_10 - opponent_ace_rate_10.
      - name: break_pct_diff
        description: player_break_pct_10 - opponent_break_pct_10.
      - name: win_streak_diff
        description: player_win_streak - opponent_win_streak.
      - name: matches_30d_diff
        description: player_matches_30d - opponent_matches_30d.
      - name: surface_win_rate_diff
        description: player_surface_win_rate_10 - opponent_surface_win_rate_10.
      - name: rank_trend_diff
        description: player_rank_trend_10 - opponent_rank_trend_10.

      # Context
      - name: is_clay
        description: 1 if surface = clay, else 0.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_grass
        description: 1 if surface = grass, else 0.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: is_hard
        description: 1 if surface = hard, else 0.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: tournament_level
        description: Tournament tier ordinal (grand_slam=4, masters=3, atp_500=2, atp_250=1, else 0).
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4]
      - name: round_encoded
        description: Round ordinal (r128=1 ... f=7, else 0).
        tests:
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3, 4, 5, 6, 7]
