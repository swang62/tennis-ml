version: 2

models:
  - name: feature_defaults
    description: >
      ONE ROW PER AS-OF DATE (every historical match date plus the dbt run
      date) of deterministic imputation defaults for the model feature
      contract. Every pool value is computed only from
      silver.rolling_features snapshots strictly before the as-of date
      (`snapshot_date < as_of_date`), plus the static profile pool, so no
      current-match or future state leaks in. Rank/rank-points/streak-like
      values use the (rounded) median; rates, age, years-pro, and handedness
      rate use the mean; an empty prior pool falls back to explicit constants.
      Both gold.match_features and scalar/bulk inference impute missing side
      values from the newest row at or before their match/as-of date instead of
      running AVG/PERCENTILE queries at request time.
    columns:
      - name: as_of_date
        description: The date the defaults apply to (a historical match date or the dbt run date).
        tests:
          - not_null
          - unique

      # Rank / streak-like medians (rounded) with empty-pool constants.
      - name: latest_player_ranking
        description: Median latest_player_ranking over prior snapshots; 100 when the pool is empty.
      - name: latest_player_rank_points
        description: Median latest_player_rank_points over prior snapshots; 500 when empty.
      - name: streak
        description: Median streak over prior snapshots; 0 when empty.
      - name: avg_player_rank_10
        description: Median avg_player_rank_10 over prior snapshots; 100 when empty.
      - name: avg_rank_faced_10
        description: Median avg_rank_faced_10 over prior snapshots; 100 when empty.

      # Continuous means over prior snapshots (0.0 when empty).
      - name: latest_player_age
        description: Mean latest_player_age over prior snapshots; 26.0 when empty.
      - name: weighted_form_10
        description: Mean weighted_form_10 over prior snapshots; 0.0 when empty.
      - name: win_rate_10
        description: Mean win_rate_10 over prior snapshots; 0.0 when empty.
      - name: ace_rate_10
        description: Mean ace_rate_10 over prior snapshots; 0.0 when empty.
      - name: first_serve_pct_10
        description: Mean first_serve_pct_10 over prior snapshots; 0.0 when empty.
      - name: break_points_saved_pct_10
        description: Mean break_points_saved_pct_10 over prior snapshots; 0.0 when empty.
      - name: first_serve_win_pct_10
        description: Mean first_serve_win_pct_10 over prior snapshots; 0.0 when empty.
      - name: second_serve_win_pct_10
        description: Mean second_serve_win_pct_10 over prior snapshots; 0.0 when empty.
      - name: serve_win_pct_10
        description: Mean serve_win_pct_10 over prior snapshots; 0.0 when empty.
      - name: return_points_won_pct_10
        description: Mean return_points_won_pct_10 over prior snapshots; 0.0 when empty (similarity-only input).
      - name: df_rate_10
        description: Mean df_rate_10 over prior snapshots; 0.0 when empty.
      - name: aces_per_svc_game_10
        description: Mean aces_per_svc_game_10 over prior snapshots; 0.0 when empty.
      - name: clay_win_rate_10
        description: Mean clay_win_rate_10 over prior snapshots; 0.0 when empty.
      - name: grass_win_rate_10
        description: Mean grass_win_rate_10 over prior snapshots; 0.0 when empty.
      - name: hard_win_rate_10
        description: Mean hard_win_rate_10 over prior snapshots; 0.0 when empty.

      # Cold-start activity defaults (median, rounded to a whole value).
      - name: days_since_default
        description: Median days since each player's latest eligible snapshot; 365 when the pool is empty.
      - name: matches_30d_default
        description: Median 30-day pre-as-of match count across players; 0 when the pool is empty.

      # Explicit fixed constants and static profile-pool means.
      - name: rate_default
        description: Fixed rate constant (0.0) used for the unknown/0 surface win rate and empty-pool rates.
      - name: left_handed_rate
        description: Mean left-handed rate over all profiles; 0.0 when no profiles exist.
      - name: avg_years_pro
        description: Mean years-pro across all profiles at the as-of year; 8.0 when no profiles exist.

      # Meta-only observability counts (not model features).
      - name: snapshot_pool_rows
        description: Number of prior snapshots in the pool for this as-of date.
      - name: snapshot_pool_players
        description: Number of distinct players with an eligible prior snapshot.
      - name: profile_rows
        description: Number of rows in gold.player_profiles.
