name: tennis_ml
version: "1.0.0"
config-version: 2

profile: tennis_ml

model-paths: ["models"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  tennis_ml:
    # bronze raw matches -> silver player snapshots -> gold match features.
    silver:
      +materialized: table
      +schema: silver

      # CTAS tables need post-hooks; macros replace stale objects after dbt swaps.
      player_matches:
        +post-hook:
          - "{{ ensure_primary_key_sql(this, 'pk_player_matches', 'player_id, match_id') }}"
          - "{{ ensure_index_sql(this, 'idx_player_matches_pid_date', 'player_id, match_date') }}"

      rolling_features:
        +post-hook:
          - "{{ ensure_primary_key_sql(this, 'pk_rolling_features', 'player_id, match_id') }}"
          - "{{ ensure_index_sql(this, 'idx_rolling_pid_date', 'player_id, snapshot_date') }}"

    gold:
      +materialized: table
      +schema: gold

      # Reapply keys and indexes after materialization replaces the table.
      feature_defaults:
        +post-hook:
          - "{{ ensure_primary_key_sql(this, 'pk_feature_defaults', 'as_of_date') }}"

      match_features:
        +post-hook:
          - "{{ ensure_primary_key_sql(this, 'pk_match_features', 'match_id') }}"
          - "{{ ensure_index_sql(this, 'idx_match_features_player_id', 'player_id') }}"
          - "{{ ensure_index_sql(this, 'idx_match_features_opponent_id', 'opponent_id') }}"
