name: tennis_ml
version: "1.0.0"
config-version: 2

profile: tennis_ml

model-paths: ["models"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  tennis_ml:
    gold:
      +materialized: table

      # Gold tables are built via CREATE TABLE AS SELECT, so PKs and secondary
      # indexes cannot live in init.sql (bronze/PK side). Post-hooks apply them
      # after each model materializes. DuckDB table materialization replaces
      # the table, so the DDL is re-applied on every build.
      match_features:
        +post-hook:
          - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_match_features PRIMARY KEY (match_id)"
          - "CREATE INDEX IF NOT EXISTS idx_match_features_player_id ON {{ this }} (player_id)"
          - "CREATE INDEX IF NOT EXISTS idx_match_features_opponent_id ON {{ this }} (opponent_id)"

      player_matches:
        +post-hook:
          - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_player_matches PRIMARY KEY (player_id, match_id)"
          - "CREATE INDEX IF NOT EXISTS idx_player_matches_pid_date ON {{ this }} (player_id, match_date)"

      player_rankings:
        +post-hook:
          - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_player_rankings PRIMARY KEY (player_id, match_id)"
          - "CREATE INDEX IF NOT EXISTS idx_player_rankings_pid_date ON {{ this }} (player_id, match_date)"

      player_rolling_features:
        +post-hook:
          - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_player_rolling_features PRIMARY KEY (player_id, match_id)"
          - "CREATE INDEX IF NOT EXISTS idx_player_rolling_pid_date ON {{ this }} (player_id, snapshot_date)"
