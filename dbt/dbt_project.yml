name: tennis_ml
version: "1.0.0"
config-version: 2

profile: tennis_ml

model-paths: ["models"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  tennis_ml:
    # Medallion layering: bronze.match_events (raw, ingest) -> silver
    # (per-player expansion: player_matches, player_rankings) -> gold
    # (features: rolling_features, match_features).
    silver:
      +materialized: table
      +schema: silver

      # Silver tables are built via CREATE TABLE AS SELECT, so PKs and
      # secondary indexes cannot live in init.sql (bronze/PK side). Post-hooks
      # apply them after each model materializes. DuckDB table materialization
      # replaces the table, so the DDL is re-applied on every build.
      player_matches:
        +post-hook:
          - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_player_matches PRIMARY KEY (player_id, match_id)"
          - "CREATE INDEX IF NOT EXISTS idx_player_matches_pid_date ON {{ this }} (player_id, match_date)"

      player_rankings:
        +post-hook:
          - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_player_rankings PRIMARY KEY (player_id, match_id)"
          - "CREATE INDEX IF NOT EXISTS idx_player_rankings_pid_date ON {{ this }} (player_id, match_date)"

    gold:
      +materialized: table
      +schema: gold

      # Same post-hook rationale as silver: PKs/indexes are re-applied on every
      # build because DuckDB table materialization replaces the table.
      match_features:
        +post-hook:
          - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_match_features PRIMARY KEY (match_id)"
          - "CREATE INDEX IF NOT EXISTS idx_match_features_player_id ON {{ this }} (player_id)"
          - "CREATE INDEX IF NOT EXISTS idx_match_features_opponent_id ON {{ this }} (opponent_id)"

      rolling_features:
        +post-hook:
          - "ALTER TABLE {{ this }} ADD CONSTRAINT pk_rolling_features PRIMARY KEY (player_id, match_id)"
          - "CREATE INDEX IF NOT EXISTS idx_rolling_pid_date ON {{ this }} (player_id, snapshot_date)"
